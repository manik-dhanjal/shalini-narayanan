# Reusable build + deploy to Netlify. Called by deploy-dev.yml and deploy-prod.yml.
# Expects on the GitHub environment (or repository):
#   secret   NETLIFY_AUTH_TOKEN - Netlify personal access token
#   variable NETLIFY_SITE_ID    - Project ID of the Netlify site for that environment
name: Netlify deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the secrets (DEV or PROD)
        required: true
        type: string
      deploy-env:
        description: Value of GATSBY_DEPLOY_ENV (`dev` blocks crawlers and analytics)
        required: true
        type: string
      url:
        description: Public URL of the deployed site
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      GATSBY_DEPLOY_ENV: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Gatsby cache
        uses: actions/cache@v6
        with:
          path: |
            .cache
            public
          key: gatsby-${{ inputs.deploy-env }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: gatsby-${{ inputs.deploy-env }}-${{ runner.os }}-

      - name: Build
        run: npm run build

      - name: Keep dev out of search engines
        if: inputs.deploy-env == 'dev'
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > public/_headers

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@27.16.1 deploy
          --dir=public
          --no-build
          --prod
          --message="${{ github.ref_name }}@${{ github.sha }}"
